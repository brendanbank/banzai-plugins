###################################################################
# Local syslog-ng configuration for kea-dhcp-ddns [keaddns].
#
# Kea's kea-dhcp-ddns daemon outputs multi-line log messages (each
# DDNS event includes continuation lines for FQDN, IP, DHCID, etc.).
# OPNsense's core log viewer is line-oriented, so we join continuation
# lines with " | " before writing to the log file.
#
# We use an explicit template() instead of flags(syslog-protocol)
# because syslog-protocol serializes from the original wire format,
# bypassing the rewrite. The template uses the rewritten $MESSAGE.
#
# This defines a complete log path with flags(final) so that the
# auto-generated log statement from syslog-ng-local.conf never fires
# for these messages.
###################################################################
filter f_local_keaddns {
    program("kea-dhcp-ddns");
};

rewrite r_keaddns_join_lines {
    subst("\n", " | ", value("MESSAGE"), flags("global"));
};

destination d_keaddns {
    file(
        "/var/log/keaddns/keaddns_${YEAR}${MONTH}${DAY}.log"
        create-dirs(yes)
        template("<${PRI}>1 ${ISODATE} ${HOST} ${PROGRAM} ${PID} - [meta sequenceId=\"${.SDATA.meta.sequenceId}\"] ${MESSAGE}\n")
        persist-name("d_keaddns")
    );
};

log {
    source(s_all);
    filter(f_local_keaddns);
    rewrite(r_keaddns_join_lines);
    destination(d_keaddns);
    flags(final);
};
