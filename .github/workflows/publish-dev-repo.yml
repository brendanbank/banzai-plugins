name: Publish dev repo to GitHub Pages

on:
  push:
    branches:
      - main
      - devel
    paths:
      - 'docs/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout devel branch
        uses: actions/checkout@v4
        with:
          ref: devel
          path: devel
        continue-on-error: true

      - name: Merge docs from main and devel
        run: |
          mkdir -p _site
          cp -r main/docs/* _site/
          if [ -d devel/docs/FreeBSD:14:amd64/26.1/dev ]; then
            mkdir -p _site/FreeBSD:14:amd64/26.1/dev
            cp -rf devel/docs/FreeBSD:14:amd64/26.1/dev/* \
                   _site/FreeBSD:14:amd64/26.1/dev/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
