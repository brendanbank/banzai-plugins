name: Publish dev repo to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - devel

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout devel branch
        uses: actions/checkout@v4
        with:
          ref: devel
          path: devel
        continue-on-error: true

      - name: Merge docs from main and devel
        run: |
          mkdir -p _site
          cp -r main/docs/* _site/
          # Overlay every dev repo from the devel branch, for any ABI/series
          # (docs/<ABI>/<series>/dev), instead of a single hardcoded path.
          if [ -d devel/docs ]; then
            for devdir in devel/docs/*/*/dev; do
              [ -d "$devdir" ] || continue
              rel=${devdir#devel/docs/}
              mkdir -p "_site/${rel}"
              cp -rf "$devdir"/* "_site/${rel}/"
              echo "overlaid dev repo: ${rel}"
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
